<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" fill="none">
  <defs>
    <linearGradient id="bodyPaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="40%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="bodyPaintHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="windowTint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2a3a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="windshieldTint" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4a6a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="chromeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>
    <radialGradient id="wheelCenter" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#444"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
    <radialGradient id="wheelRim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="60%" stop-color="#888"/>
      <stop offset="100%" stop-color="#555"/>
    </radialGradient>
    <linearGradient id="groundReflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="440" cy="400" rx="370" ry="18" fill="rgba(0,0,0,0.25)"/>
  <ellipse cx="440" cy="400" rx="280" ry="10" fill="rgba(0,0,0,0.15)"/>

  <!-- Ground reflection -->
  <ellipse cx="440" cy="405" rx="350" ry="10" fill="url(#groundReflection)"/>

  <!-- ===== MAIN BODY ===== -->
  <g>
    <!-- Lower body / rocker panel -->
    <path d="M130 285 L150 235 L210 195 L300 175 L560 175 L650 195 L720 235 L740 285 L740 320 L130 320 Z" fill="url(#bodyPaint)" stroke="#222" stroke-width="0.5"/>

    <!-- Hood -->
    <path d="M130 285 L150 235 L210 195 L300 175 L400 175 L400 320 L130 320 Z" fill="url(#bodyPaintHighlight)" stroke="#222" stroke-width="0.5"/>

    <!-- Roof -->
    <path d="M300 175 L310 120 L380 105 L520 105 L550 120 L560 175 Z" fill="url(#bodyPaint)" stroke="#222" stroke-width="0.5"/>

    <!-- Rear body / trunk area -->
    <path d="M560 175 L650 195 L720 235 L740 285 L740 320 L560 320 Z" fill="url(#bodyPaintHighlight)" stroke="#222" stroke-width="0.5"/>

    <!-- Rear quarter panel -->
    <path d="M560 175 L550 120 L520 105 L520 175 Z" fill="url(#bodyPaint)" stroke="#222" stroke-width="0.5"/>
  </g>

  <!-- ===== WINDOWS ===== -->
  <g>
    <!-- Windshield -->
    <path d="M295 175 L305 128 L370 110 L400 108 L400 175 Z" fill="url(#windshieldTint)" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Front side window -->
    <path d="M400 108 L400 175 L490 175 L490 110 Z" fill="url(#windowTint)" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Rear side window -->
    <path d="M490 110 L490 175 L555 175 L545 118 L520 108 Z" fill="url(#windowTint)" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Window chrome trim -->
    <path d="M295 175 L305 128 L370 110 L400 108 L490 108 L520 108 L545 118 L555 175" fill="none" stroke="url(#chromeGradient)" stroke-width="1.5"/>

    <!-- B-pillar -->
    <rect x="397" y="108" width="6" height="67" fill="#0a0a0a" rx="1"/>
  </g>

  <!-- ===== FRONT GRILLE ===== -->
  <g>
    <!-- Grille surround (large spindle grille) -->
    <path d="M130 250 L130 295 L155 295 L155 250 Z" fill="#111" stroke="url(#chromeGradient)" stroke-width="1.5"/>

    <!-- Grille horizontal bars -->
    <rect x="132" y="255" width="22" height="3" rx="1" fill="url(#chromeGradient)" opacity="0.7"/>
    <rect x="132" y="262" width="22" height="3" rx="1" fill="url(#chromeGradient)" opacity="0.7"/>
    <rect x="132" y="269" width="22" height="3" rx="1" fill="url(#chromeGradient)" opacity="0.7"/>
    <rect x="132" y="276" width="22" height="3" rx="1" fill="url(#chromeGradient)" opacity="0.7"/>
    <rect x="132" y="283" width="22" height="3" rx="1" fill="url(#chromeGradient)" opacity="0.7"/>

    <!-- Toyota emblem (simplified) -->
    <ellipse cx="143" cy="273" rx="6" ry="5" fill="url(#chromeGradient)"/>
    <ellipse cx="143" cy="273" rx="4" ry="3" fill="#111"/>
  </g>

  <!-- ===== HEADLIGHTS ===== -->
  <g>
    <!-- Main headlight -->
    <path d="M130 235 L140 228 L148 235 L148 250 L130 250 Z" fill="#e8e8e8" opacity="0.9"/>
    <path d="M133 237 L140 232 L145 237 L145 248 L133 248 Z" fill="#fff" opacity="0.5"/>

    <!-- LED DRL strip -->
    <path d="M130 238 L146 238" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- ===== TAILLIGHTS ===== -->
  <g>
    <path d="M740 245 L735 240 L730 245 L730 275 L740 275 Z" fill="#cc1111" opacity="0.85"/>
    <path d="M738 250 L733 246 L731 252" fill="#ff3333" opacity="0.6"/>
  </g>

  <!-- ===== BUMPERS ===== -->
  <g>
    <!-- Front bumper -->
    <path d="M125 295 L125 315 L160 315 L160 295 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>

    <!-- Front bumper lower lip -->
    <path d="M125 310 L125 320 L165 320 L165 310 Z" fill="#111"/>

    <!-- Rear bumper -->
    <path d="M730 295 L730 315 L745 315 L745 295 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>

    <!-- Rear diffuser -->
    <path d="M730 310 L730 320 L745 320 L745 310 Z" fill="#111"/>
  </g>

  <!-- ===== FENDER ARCHES ===== -->
  <g>
    <!-- Front fender arch -->
    <path d="M190 260 Q190 305 230 320 L270 320 Q310 305 310 260" fill="none" stroke="#1a1a1a" stroke-width="6"/>
    <path d="M190 260 Q190 305 230 320 L270 320 Q310 305 310 260" fill="none" stroke="#2a2a2a" stroke-width="3"/>

    <!-- Rear fender arch -->
    <path d="M530 260 Q530 305 570 320 L610 320 Q650 305 650 260" fill="none" stroke="#1a1a1a" stroke-width="6"/>
    <path d="M530 260 Q530 305 570 320 L610 320 Q650 305 650 260" fill="none" stroke="#2a2a2a" stroke-width="3"/>
  </g>

  <!-- ===== SIDE DETAILS ===== -->
  <g>
    <!-- Body character line -->
    <path d="M150 240 L210 210 L300 190 L560 190 L650 210 L720 240" fill="none" stroke="#2a2a2a" stroke-width="1" opacity="0.5"/>

    <!-- Side lower character line -->
    <path d="M155 270 L210 250 L300 235 L560 235 L650 250 L730 270" fill="none" stroke="#2a2a2a" stroke-width="0.8" opacity="0.3"/>

    <!-- Running board / side step (pimped) -->
    <rect x="220" y="310" width="360" height="10" rx="3" fill="#111" stroke="#333" stroke-width="0.5"/>
    <rect x="225" y="312" width="350" height="3" rx="1" fill="#222"/>

    <!-- Door handles -->
    <rect x="340" y="225" width="22" height="4" rx="2" fill="url(#chromeGradient)"/>
    <rect x="500" y="225" width="22" height="4" rx="2" fill="url(#chromeGradient)"/>

    <!-- Side mirror -->
    <path d="M210 195 L210 210 L225 215 L230 205 L225 195 Z" fill="#111" stroke="#333" stroke-width="0.5"/>
    <path d="M213 198 L213 207 L224 211 L226 205 L223 198 Z" fill="#1a1a1a"/>
  </g>

  <!-- ===== WHEELS (Pimped 22-inch custom rims) ===== -->
  <g>
    <!-- Front wheel -->
    <!-- Tire -->
    <circle cx="250" cy="320" r="52" fill="#0a0a0a"/>
    <circle cx="250" cy="320" r="47" fill="#111"/>
    <circle cx="250" cy="320" r="44" fill="#151515"/>
    <!-- Rim lip -->
    <circle cx="250" cy="320" r="42" fill="none" stroke="url(#chromeGradient)" stroke-width="2.5"/>
    <!-- Rim face -->
    <circle cx="250" cy="320" r="38" fill="url(#wheelRim)"/>
    <!-- Spokes (5-spoke custom design) -->
    <g stroke="#999" stroke-width="4" stroke-linecap="round">
      <line x1="250" y1="320" x2="250" y2="285"/>
      <line x1="250" y1="320" x2="250" y2="355"/>
      <line x1="250" y1="320" x2="215" y2="320"/>
      <line x1="250" y1="320" x2="285" y2="320"/>
      <line x1="250" y1="320" x2="222" y2="292"/>
      <line x1="250" y1="320" x2="278" y2="348"/>
      <line x1="250" y1="320" x2="278" y2="292"/>
      <line x1="250" y1="320" x2="222" y2="348"/>
    </g>
    <!-- Spoke highlights -->
    <g stroke="#ccc" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
      <line x1="250" y1="320" x2="250" y2="288"/>
      <line x1="250" y1="320" x2="250" y2="352"/>
      <line x1="250" y1="320" x2="218" y2="320"/>
      <line x1="250" y1="320" x2="282" y2="320"/>
    </g>
    <!-- Center cap -->
    <circle cx="250" cy="320" r="12" fill="url(#wheelCenter)"/>
    <circle cx="250" cy="320" r="8" fill="#333"/>
    <circle cx="250" cy="320" r="5" fill="url(#chromeGradient)"/>
    <!-- Brake caliper (visible through spokes) -->
    <path d="M238 305 Q245 302 255 305" fill="none" stroke="#cc0000" stroke-width="3" opacity="0.7"/>

    <!-- Rear wheel -->
    <!-- Tire -->
    <circle cx="610" cy="320" r="52" fill="#0a0a0a"/>
    <circle cx="610" cy="320" r="47" fill="#111"/>
    <circle cx="610" cy="320" r="44" fill="#151515"/>
    <!-- Rim lip -->
    <circle cx="610" cy="320" r="42" fill="none" stroke="url(#chromeGradient)" stroke-width="2.5"/>
    <!-- Rim face -->
    <circle cx="610" cy="320" r="38" fill="url(#wheelRim)"/>
    <!-- Spokes -->
    <g stroke="#999" stroke-width="4" stroke-linecap="round">
      <line x1="610" y1="320" x2="610" y2="285"/>
      <line x1="610" y1="320" x2="610" y2="355"/>
      <line x1="610" y1="320" x2="575" y2="320"/>
      <line x1="610" y1="320" x2="645" y2="320"/>
      <line x1="610" y1="320" x2="582" y2="292"/>
      <line x1="610" y1="320" x2="638" y2="348"/>
      <line x1="610" y1="320" x2="638" y2="292"/>
      <line x1="610" y1="320" x2="582" y2="348"/>
    </g>
    <!-- Spoke highlights -->
    <g stroke="#ccc" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
      <line x1="610" y1="320" x2="610" y2="288"/>
      <line x1="610" y1="320" x2="610" y2="352"/>
      <line x1="610" y1="320" x2="578" y2="320"/>
      <line x1="610" y1="320" x2="642" y2="320"/>
    </g>
    <!-- Center cap -->
    <circle cx="610" cy="320" r="12" fill="url(#wheelCenter)"/>
    <circle cx="610" cy="320" r="8" fill="#333"/>
    <circle cx="610" cy="320" r="5" fill="url(#chromeGradient)"/>
    <!-- Brake caliper -->
    <path d="M598 305 Q605 302 615 305" fill="none" stroke="#cc0000" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- ===== ROOF RAILS ===== -->
  <g>
    <rect x="330" y="103" width="180" height="4" rx="2" fill="#222"/>
    <rect x="330" y="99" width="180" height="3" rx="1.5" fill="#333"/>
    <!-- Rail mounts -->
    <rect x="335" y="100" width="6" height="8" rx="1" fill="#222"/>
    <rect x="370" y="100" width="6" height="8" rx="1" fill="#222"/>
    <rect x="460" y="100" width="6" height="8" rx="1" fill="#222"/>
    <rect x="498" y="100" width="6" height="8" rx="1" fill="#222"/>
  </g>

  <!-- ===== SUNROOF ===== -->
  <rect x="360" y="112" width="100" height="8" rx="4" fill="#0a1520" opacity="0.7" stroke="#333" stroke-width="0.5"/>

  <!-- ===== FOG LIGHTS ===== -->
  <circle cx="138" cy="302" r="5" fill="#ddd" opacity="0.7"/>
  <circle cx="138" cy="302" r="3" fill="#fff" opacity="0.4"/>

  <!-- ===== EXHAUST TIPS ===== -->
  <rect x="735" y="307" width="12" height="6" rx="3" fill="url(#chromeGradient)"/>
  <rect x="733" y="308" width="14" height="4" rx="2" fill="#888"/>

  <!-- ===== BODY HIGHLIGHT / GLOSS ===== -->
  <g opacity="0.08">
    <path d="M200 200 L250 190 L350 185 L500 185 L600 195 L680 215" fill="none" stroke="white" stroke-width="8"/>
  </g>
  <g opacity="0.05">
    <path d="M200 210 L250 200 L350 195 L500 195 L600 205 L680 225" fill="none" stroke="white" stroke-width="3"/>
  </g>

  <!-- ===== PINSTRIPE ===== -->
  <path d="M155 250 L210 228 L300 210 L560 210 L650 228 L725 250" fill="none" stroke="#cc0000" stroke-width="0.8" opacity="0.4"/>

  <!-- ===== LICENSE PLATE ===== -->
  <rect x="702" y="288" width="30" height="12" rx="1" fill="#fff" stroke="#333" stroke-width="0.5"/>
  <rect x="704" y="290" width="26" height="8" rx="0.5" fill="#ffcc00"/>
  <text x="717" y="296" font-size="4" fill="#000" text-anchor="middle" font-weight="bold">LC300</text>
</svg>